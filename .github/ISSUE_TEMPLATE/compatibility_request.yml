name: Unsupported Buffalo model compatibility request
description: Request investigation of an unverified LinkStation or CloudStation model
title: "[Compatibility]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for a Buffalo model that is not listed as verified.

        **Never attach an original HAR file, session cookie, password, credential, authorization value, or unredacted network capture.** Credentials are never required. Follow the compatibility diagnostics guide and manually inspect the generated JSON before attaching it.

  - type: input
    id: nas_model
    attributes:
      label: NAS model
      description: Enter the exact model shown on the device or Buffalo Web UI.
      placeholder: LS520D
    validations:
      required: true

  - type: input
    id: firmware_version
    attributes:
      label: Firmware version
      placeholder: "4.00"
    validations:
      required: true

  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.0"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Buffalo LinkStation integration version
      placeholder: "0.3.0"
    validations:
      required: true

  - type: textarea
    id: observed_problem
    attributes:
      label: Observed problem
      description: Describe setup, authentication, connection, or missing read-only data behavior. Do not include credentials, addresses, hostnames, serial numbers, or raw responses.
    validations:
      required: true

  - type: textarea
    id: troubleshooting
    attributes:
      label: Relevant troubleshooting results
      description: Include only reviewed, non-sensitive observations. Do not execute power or configuration-changing operations for this report.
    validations:
      required: false

  - type: textarea
    id: sanitized_diagnostic
    attributes:
      label: Sanitized diagnostic JSON
      description: Drag the manually reviewed JSON generated by tools/sanitize_har.py here. Never attach the original HAR. Attaching diagnostics is optional.
    validations:
      required: false

  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach an original HAR, cookie, password, credential, authorization value, or unredacted network capture.
          required: true
        - label: I manually reviewed every line of the sanitized diagnostic and removed any remaining identifying or sensitive information.
          required: true

  - type: checkboxes
    id: support_expectation
    attributes:
      label: Compatibility expectation
      options:
        - label: I understand that submitting diagnostics does not guarantee support for this model.
          required: true

name: Release tag validation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run privacy check
        run: python3 tools/check_privacy.py
      - name: Verify tag and project versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 -c "import json, os, pathlib, tomllib;
          root = pathlib.Path('.');
          expected = os.environ['RELEASE_TAG'].removeprefix('v');
          manifest = json.loads((root / 'custom_components/buffalo_linkstation/manifest.json').read_text())['version'];
          project = tomllib.loads((root / 'pyproject.toml').read_text())['project']['version'];
          assert manifest == project == expected,
          f'tag={expected}, manifest={manifest}, project={project}'"

[project]
name = "home-assistant-buffalo-linkstation"
version = "0.1.0"
description = "Home Assistant integration for Buffalo LinkStation NAS devices"
readme = "README.md"
requires-python = ">=3.13.0"
license = "MIT"
authors = [{ name = "placix" }]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=custom_components.buffalo_linkstation --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",
  "COM812",
  "CPY001",
  "D107",
  "D203",
  "D213",
  "EM101",
  "EM102",
  "PLR0913",
  "PLR2004",
  "TC001",
  "TC002",
  "TC003",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "ANN",
  "ARG",
  "ARG005",
  "D",
  "PLR2004",
  "PT011",
  "PT022",
  "S101",
  "S105",
  "S106",
  "SLF001",
]
"tools/*" = ["T201"]
